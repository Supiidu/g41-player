plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.g41.glassplayer'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.g41.glassplayer'
        minSdk 28
        targetSdk 35
        versionCode 6
        versionName '0.5.1-clock-fix'
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Compile only: provided by the hooking framework on the phone.
    compileOnly files('libs/api-82.jar')
}
